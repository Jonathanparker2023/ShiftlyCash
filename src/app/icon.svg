<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Detailed city skyline: 4 towers w/ varied rooftops + windows. Brand green on app-bg dark. -->

  <!-- TOWER 1 (shortest, leftmost): flat top + parapet -->
  <rect x="8"  y="58" width="14" height="29" fill="#10b860"/>
  <rect x="10" y="55" width="10" height="3"  fill="#10b860"/>

  <!-- TOWER 2: Art Deco stepped/setback top -->
  <rect x="29" y="48" width="14" height="39" fill="#10b860"/>
