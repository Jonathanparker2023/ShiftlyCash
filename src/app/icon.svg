  <rect x="33" y="40" width="6"  height="4"  fill="#10b860"/>

  <!-- TOWER 3: pyramidal cap (Empire State / Chrysler vibe) -->
  <rect x="50" y="34" width="14" height="53" fill="#10b860"/>
  <path d="M 50,34 L 57,22 L 64,34 Z" fill="#10b860"/>

  <!-- TOWER 4 (tallest): crown + spire/antenna (Burj Khalifa vibe) -->
  <rect x="71" y="22" width="14" height="65" fill="#10b860"/>
  <rect x="74" y="18" width="8"  height="4"  fill="#10b860"/>
  <rect x="77" y="4"  width="2"  height="14" fill="#10b860"/>

